<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk Ticketing System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ddd; margin-top: 10px; min-height: 100px; box-sizing: border-box; }
        input[type="submit"] { width: 100%; background-color: #007BFF; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        input[type="submit"]:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Sistem Helpdesk Cerdas</h1>
        <form action="/" method="post">
            <label for="masalah">Jelaskan Masalah Anda:</label>
            <textarea id="masalah" name="masalah" rows="5" required></textarea>
            <input type="submit" value="Kirim Tiket">
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
